name: Monitor Competitors

on:
  schedule:
    # 매주 월요일 00:00 UTC에 실행
    - cron: "0 0 * * 1"
  workflow_dispatch:
    # GitHub Actions 탭에서 수동으로도 실행 가능

jobs:
  collect-and-report:
    runs-on: ubuntu-latest

    env:
      # API 키 — 저장소 Settings → Secrets and variables → Actions 에 등록하세요.
      # 발급 방법: docs/API_KEYS.md
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # config.yaml 준비
      # 팀 전용 설정이 있다면 config.example.yaml 대신 저장소에 config.yaml을
      # 직접 커밋하거나 (API 키 없는 설정 값만 포함), 별도 시크릿으로 템플릿을
      # 주입하는 방식을 사용하세요. 아래는 예시 설정을 그대로 복사하는 기본값입니다.
      - name: Prepare config.yaml
        run: |
          if [ ! -f config.yaml ]; then
            cp config.example.yaml config.yaml
            echo "config.yaml not found — copied from config.example.yaml."
            echo "Edit config.yaml and commit it to the repository for real runs."
          else
            echo "Using committed config.yaml."
          fi

      - name: Run collector and generate report
        run: python -m competitor_monitor.cli run

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competitor-reports-${{ github.run_id }}
          path: reports/
          retention-days: 90

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competitor-data-${{ github.run_id }}
          path: data/
          retention-days: 90

      # 선택: SQLite DB를 저장소에 커밋하면 GitHub Actions 아티팩트 없이도
      # 누적 히스토리가 유지됩니다. 단, DB 파일이 커지면 리포지토리 크기에 영향을
      # 주므로 주의하세요. 사용하려면 아래 주석을 해제하고 쓰기 권한을 설정하세요.
      #
      # - name: Commit updated database back to repository
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add data/monitor.db
      #     git diff --cached --quiet || git commit -m "chore: update monitor.db [skip ci]"
      #     git push
